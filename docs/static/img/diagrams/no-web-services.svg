<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Two ways to automate Moodle: its web services need an administrator, a token and enabled functions; moodle-driver only needs the person to log in once.</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="980" height="400" rx="24" fill="#f8fafc"/>
  <text x="490" y="44" font-size="22" font-weight="800" text-anchor="middle" fill="#0f172a">Two ways to automate Moodle</text>

  <!-- Web services -->
  <g filter="url(#shadow)"><rect x="30" y="70" width="440" height="300" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/></g>
  <svg x="132" y="90" width="28" height="28" viewBox="0 0 24 24"><path d="M12 0C5.3726 0 0 5.3726 0 12s5.3726 12 12 12 12-5.3726 12-12S18.6274 0 12 0Zm1.1348 5.7402.0351.123-2.7363 1.9903c.3694.2606.7968.609 1.0078.8438l.0762.1035c-1.2878 2.2571-3.737 3.0557-6.3164 2.1816l.0195-.1601h-.002c-.0784-.5679-.0962-1.0524-.0585-1.463-.7507-.003-1.5298-.0402-2.2832-.0663l-.5157.0175c-.0994.8449-.0351 2.135-.0254 2.3223.3492 1.2819.2977 2.2907.295 3.5293-.4134-1.0028-.8995-2.097-.416-3.4668l-.0098-.3183c-.0007-.0143-.0683-1.1532.037-2.0625l-.4081.0136-.0371-.1191C5.7922 6.8402 8.5032 6.218 13.1348 5.7402Zm1.623 2.5137c1.2202 0 2.1885.2691 2.9043.8066.8138.601 1.2207 1.4866 1.2207 2.6582v5.6856h-2.7344v-5.3691c0-1.1225-.4634-1.6836-1.3906-1.6836-.9278 0-1.3906.561-1.3906 1.6836v5.3691h-2.7344v-5.3691c0-.5183-.0986-.9144-.293-1.1934.6172-.435 1.1534-1.0124 1.5723-1.7246.0297.029.0597.0574.0879.0879.5044-.6349 1.4233-.9512 2.7578-.9512zm-9.6094 3.2344c.932.3 1.8614.393 2.7364.287a3.5455 3.5455 0 0 0-.0098.2599v5.3691H5.1426v-5.6855c0-.0787.0022-.1544.0058-.2305z" fill="#F98012"/></svg><text x="168" y="110" font-size="20" font-weight="800" fill="#991b1b">Moodle's web services</text>
  <g font-size="16" fill="#7f1d1d">
    <text x="60" y="152">1️⃣  Ask an administrator to enable them</text>
    <text x="60" y="190">2️⃣  Get a service and a token created</text>
    <text x="60" y="228">3️⃣  Only the functions they enabled</text>
    <text x="60" y="266">4️⃣  Keep the token secret: it's a key</text>
    <text x="60" y="304">⛔  Many sites keep them switched off</text>
  </g>
  <rect x="120" y="322" width="260" height="32" rx="16" fill="#fee2e2"/>
  <text x="250" y="344" font-size="14" font-weight="600" text-anchor="middle" fill="#991b1b">an administrator decides 📄📄</text>

  <!-- VS -->
  <circle cx="490" cy="220" r="30" fill="#0f172a"/>
  <text x="490" y="228" font-size="20" font-weight="800" text-anchor="middle" fill="#ffffff">vs</text>

  <!-- moodle-driver -->
  <g filter="url(#shadow)"><rect x="510" y="70" width="440" height="300" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/></g>
  <svg x="646" y="88" width="32" height="32" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b0b0b"/><g transform="translate(46.83 298.33)"><path d="M125.34-85.20L125.34-54.89L20.48-10.65L10.92-40.14L87.65-69.91L10.92-99.67L20.48-129.16L125.34-85.20Z" fill="#f98012"/><path d="M230.20-129.71L230.20-129.71Q240.84-129.71 247.67-126.43Q254.50-123.15 258.46-116.60Q262.42-110.05 263.78-100.08Q265.15-90.11 265.15-76.73L265.15-76.73L265.15 0L237.84 0L237.84-78.37Q237.84-86.02 236.89-90.66Q235.93-95.30 234.43-97.76Q232.93-100.22 230.88-101.03Q228.83-101.85 226.65-101.85L226.65-101.85Q224.19-101.85 221.46-101.44Q218.73-101.03 216.54-99.94L216.54-99.94Q217.36-94.75 217.91-88.47Q218.45-82.19 218.45-74.55L218.45-74.55L218.45-48.88L191.15-48.88L191.15-78.37Q191.15-91.48 188.55-96.67Q185.96-101.85 180.22-101.85L180.22-101.85Q178.59-101.85 176.26-101.58Q173.94-101.31 171.76-100.76L171.76-100.76L171.76 0L144.45 0L144.45-123.43Q155.10-126.43 165.48-128.07Q175.85-129.71 183.77-129.71L183.77-129.71Q190.87-129.71 196.47-127.93Q202.07-126.16 206.17-122.06L206.17-122.06Q210.81-125.06 217.09-127.39Q223.37-129.71 230.20-129.71Z" fill="#ffffff"/><path class="cursor" d="M275.25 45.06L275.25 15.84L407.42 15.84L407.42 45.06L275.25 45.06Z" fill="#f98012"/></g></svg><text x="686" y="111" font-size="20" font-weight="800" fill="#166534">moodle-driver</text>
  <g font-size="16" fill="#14532d">
    <text x="540" y="152">1️⃣  The person logs in once, in a window</text>
    <text x="572" y="190">(SSO and two-factor work too) 🔑</text>
    <text x="540" y="228">2️⃣  Your program works as them, in the</text>
    <text x="572" y="266">same pages and services Moodle uses</text>
    <text x="540" y="304">✅  Nothing to ask, nothing to configure</text>
  </g>
  <rect x="600" y="322" width="260" height="32" rx="16" fill="#dcfce7"/>
  <text x="730" y="344" font-size="14" font-weight="600" text-anchor="middle" fill="#166534">running in minutes ⚡</text>
</svg>
