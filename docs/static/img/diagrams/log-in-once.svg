  <g font-size="14" text-anchor="middle" fill="#334155">
    <text x="140" y="262">day 1</text>
    <text x="370" y="262">always</text>
    <text x="600" y="262">day 2, 3, 4…</text>
    <text x="835" y="262">someday</text>
  </g>
  <text x="490" y="290" font-size="13" text-anchor="middle" fill="#64748b">The password never goes through your program: SSO, CAS and two-factor work as they do for the person 🔒</text>
</svg>
