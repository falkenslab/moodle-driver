<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>moodle-driver at a glance: your program calls the driver, which works Moodle with the person's own login, and gives plain data back.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3412"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="980" height="360" rx="24" fill="url(#bg)"/>

  <!-- Your program -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="200" height="150" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  </g>
  <text x="130" y="118" font-size="40" text-anchor="middle">🧑‍💻</text>
  <text x="130" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="#1e3a8a">Your program</text>
  <text x="130" y="178" font-size="13" text-anchor="middle" fill="#334155" font-family="Consolas, Menlo, monospace">moodle.myGrades(3)</text>
  <text x="130" y="200" font-size="13" text-anchor="middle" fill="#64748b">a script, a bot, a CLI…</text>

  <!-- Driver -->
  <g filter="url(#shadow)">
    <rect x="280" y="70" width="200" height="150" rx="18" fill="#f97316"/>
  </g>
  <svg x="356" y="82" width="48" height="48" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b0b0b"/><g transform="translate(46.83 298.33)"><path d="M125.34-85.20L125.34-54.89L20.48-10.65L10.92-40.14L87.65-69.91L10.92-99.67L20.48-129.16L125.34-85.20Z" fill="#f98012"/><path d="M230.20-129.71L230.20-129.71Q240.84-129.71 247.67-126.43Q254.50-123.15 258.46-116.60Q262.42-110.05 263.78-100.08Q265.15-90.11 265.15-76.73L265.15-76.73L265.15 0L237.84 0L237.84-78.37Q237.84-86.02 236.89-90.66Q235.93-95.30 234.43-97.76Q232.93-100.22 230.88-101.03Q228.83-101.85 226.65-101.85L226.65-101.85Q224.19-101.85 221.46-101.44Q218.73-101.03 216.54-99.94L216.54-99.94Q217.36-94.75 217.91-88.47Q218.45-82.19 218.45-74.55L218.45-74.55L218.45-48.88L191.15-48.88L191.15-78.37Q191.15-91.48 188.55-96.67Q185.96-101.85 180.22-101.85L180.22-101.85Q178.59-101.85 176.26-101.58Q173.94-101.31 171.76-100.76L171.76-100.76L171.76 0L144.45 0L144.45-123.43Q155.10-126.43 165.48-128.07Q175.85-129.71 183.77-129.71L183.77-129.71Q190.87-129.71 196.47-127.93Q202.07-126.16 206.17-122.06L206.17-122.06Q210.81-125.06 217.09-127.39Q223.37-129.71 230.20-129.71Z" fill="#ffffff"/><path class="cursor" d="M275.25 45.06L275.25 15.84L407.42 15.84L407.42 45.06L275.25 45.06Z" fill="#f98012"/></g></svg>
  <text x="380" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff">moodle-driver</text>
  <text x="380" y="178" font-size="13" text-anchor="middle" fill="#fff7ed">knows Moodle's pages,</text>
  <text x="380" y="198" font-size="13" text-anchor="middle" fill="#fff7ed">forms and services</text>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="530" y="70" width="200" height="150" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  </g>
  <text x="630" y="118" font-size="40" text-anchor="middle">🔑</text>
  <text x="630" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="#5b21b6">Their own login</text>
  <text x="630" y="178" font-size="13" text-anchor="middle" fill="#334155">once, in a window;</text>
  <text x="630" y="198" font-size="13" text-anchor="middle" fill="#334155">SSO and two-factor too</text>

  <!-- Moodle -->
  <g filter="url(#shadow)">
    <rect x="780" y="70" width="170" height="150" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
  </g>
  <svg x="843" y="84" width="44" height="44" viewBox="0 0 24 24"><path d="M12 0C5.3726 0 0 5.3726 0 12s5.3726 12 12 12 12-5.3726 12-12S18.6274 0 12 0Zm1.1348 5.7402.0351.123-2.7363 1.9903c.3694.2606.7968.609 1.0078.8438l.0762.1035c-1.2878 2.2571-3.737 3.0557-6.3164 2.1816l.0195-.1601h-.002c-.0784-.5679-.0962-1.0524-.0585-1.463-.7507-.003-1.5298-.0402-2.2832-.0663l-.5157.0175c-.0994.8449-.0351 2.135-.0254 2.3223.3492 1.2819.2977 2.2907.295 3.5293-.4134-1.0028-.8995-2.097-.416-3.4668l-.0098-.3183c-.0007-.0143-.0683-1.1532.037-2.0625l-.4081.0136-.0371-.1191C5.7922 6.8402 8.5032 6.218 13.1348 5.7402Zm1.623 2.5137c1.2202 0 2.1885.2691 2.9043.8066.8138.601 1.2207 1.4866 1.2207 2.6582v5.6856h-2.7344v-5.3691c0-1.1225-.4634-1.6836-1.3906-1.6836-.9278 0-1.3906.561-1.3906 1.6836v5.3691h-2.7344v-5.3691c0-.5183-.0986-.9144-.293-1.1934.6172-.435 1.1534-1.0124 1.5723-1.7246.0297.029.0597.0574.0879.0879.5044-.6349 1.4233-.9512 2.7578-.9512zm-9.6094 3.2344c.932.3 1.8614.393 2.7364.287a3.5455 3.5455 0 0 0-.0098.2599v5.3691H5.1426v-5.6855c0-.0787.0022-.1544.0058-.2305z" fill="#F98012"/></svg>
  <text x="865" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="#9a3412">Moodle</text>
  <text x="865" y="178" font-size="13" text-anchor="middle" fill="#334155">your campus,</text>
  <text x="865" y="198" font-size="13" text-anchor="middle" fill="#334155">as it is</text>

  <!-- Arrows forward -->
  <line x1="232" y1="128" x2="276" y2="128" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="482" y1="128" x2="526" y2="128" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="732" y1="128" x2="776" y2="128" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Data back -->
  <path d="M865 224 C 865 270, 700 268, 130 268 L 130 226" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <rect x="380" y="250" width="270" height="36" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="515" y="274" font-size="15" text-anchor="middle" fill="#14532d">📦 plain data back: JSON, ISO dates</text>

  <!-- Title -->
  <text x="490" y="44" font-size="22" font-weight="800" text-anchor="middle" fill="#7c2d12">Everything a person does in Moodle, from your code</text>

  <!-- Badges -->
  <g font-size="15" font-weight="600">
    <rect x="95" y="308" width="230" height="34" rx="17" fill="#fee2e2"/>
    <text x="210" y="331" text-anchor="middle" fill="#991b1b">🚫 no web services to enable</text>
    <rect x="375" y="308" width="230" height="34" rx="17" fill="#fef9c3"/>
    <text x="490" y="331" text-anchor="middle" fill="#854d0e">🎟️ no tokens, no admin</text>
    <rect x="655" y="308" width="230" height="34" rx="17" fill="#e0e7ff"/>
    <text x="770" y="331" text-anchor="middle" fill="#3730a3">🧑 as the person logged in</text>
  </g>
</svg>
