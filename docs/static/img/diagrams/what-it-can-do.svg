<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>What moodle-driver can do: as a student, as a teacher, and for programs.</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="980" height="520" rx="24" fill="#f8fafc"/>
  <text x="490" y="44" font-size="22" font-weight="800" text-anchor="middle" fill="#0f172a">What can it do? 🧰</text>

  <!-- Student column -->
  <g filter="url(#shadow)"><rect x="30" y="70" width="300" height="350" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/></g>
  <text x="180" y="108" font-size="20" font-weight="800" text-anchor="middle" fill="#155e75">🎒 As a student</text>
  <g font-size="16" fill="#164e63">
    <text x="56" y="146">📅  Agenda, deadlines, to-dos</text>
    <text x="56" y="178">📖  Read pages, books, files</text>
    <text x="56" y="210">📝  Submit assignments</text>
    <text x="56" y="242">❓  Take quizzes, read reviews</text>
    <text x="56" y="274">🗳️  Surveys and choices</text>
    <text x="56" y="306">📘  Lessons, page by page</text>
    <text x="56" y="338">📊  My grades, my completion</text>
    <text x="56" y="370">💬  Forums and messages</text>
    <text x="56" y="402">🐢  At a person's pace, if you like</text>
  </g>

  <!-- Teacher column -->
  <g filter="url(#shadow)"><rect x="345" y="70" width="300" height="350" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/></g>
  <text x="495" y="108" font-size="20" font-weight="800" text-anchor="middle" fill="#9a3412">🧑‍🏫 As a teacher</text>
  <g font-size="16" fill="#7c2d12">
    <text x="371" y="146">🏗️  Build courses and activities</text>
    <text x="371" y="178">✅  Grade, with rubrics and guides</text>
    <text x="371" y="210">⏰  Extensions and quiz overrides</text>
    <text x="371" y="242">📋  Quiz results and structure</text>
    <text x="371" y="274">🏦  Question banks and imports</text>
    <text x="371" y="306">📈  Gradebook setup and report</text>
    <text x="371" y="338">👥  Participants, groups, inactive</text>
    <text x="371" y="370">✔️  Completion overrides</text>
    <text x="371" y="402">📆  Calendar events, forum pins</text>
  </g>

  <!-- Programs column -->
  <g filter="url(#shadow)"><rect x="660" y="70" width="290" height="350" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/></g>
  <text x="805" y="108" font-size="20" font-weight="800" text-anchor="middle" fill="#5b21b6">🛠️ For your program</text>
  <g font-size="16" fill="#4c1d95">
    <text x="686" y="146">🧩  One object, typed methods</text>
    <text x="686" y="178">📦  Plain JSON results</text>
    <text x="686" y="210">✍️  Writes say what changed</text>
    <text x="686" y="242">🚨  Errors with stable codes</text>
    <text x="686" y="274">🔌  Any Moodle AJAX service</text>
    <text x="686" y="306">🛡️  Data categories to restrict</text>
    <text x="686" y="338">👀  Show the browser on demand</text>
    <text x="686" y="370">🧪  A fake Moodle for tests</text>
    <text x="686" y="402">🌍  Any interface language</text>
  </g>

  <!-- Footer -->
  <rect x="190" y="448" width="600" height="44" rx="22" fill="#0f172a"/>
  <text x="490" y="476" font-size="16" font-weight="600" text-anchor="middle" fill="#f8fafc">Only what the person may do: Moodle checks every permission 🔐</text>
</svg>
